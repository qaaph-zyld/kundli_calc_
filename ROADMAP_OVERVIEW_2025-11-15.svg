<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .box { fill:#f5f5f5; stroke:#333; stroke-width:1.2; rx:6; ry:6; }
    .title { font-family: Arial, sans-serif; font-size:14px; font-weight:bold; }
    .text { font-family: Arial, sans-serif; font-size:12px; }
    .arrow { stroke:#555; stroke-width:1.4; marker-end:url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title">Kundli Calc – High-Level Roadmap (2025-11-15)</text>

  <!-- Row 1: Backend Core & Validation -->
  <rect x="40" y="70" width="230" height="90" class="box" />
  <text x="55" y="95" class="title">1. Backend Core (Done ~90%)</text>
  <text x="55" y="115" class="text">Swiss Ephemeris, houses, divisional</text>
  <text x="55" y="132" class="text">charts D1–D60, strengths, dashas</text>

  <rect x="340" y="70" width="230" height="90" class="box" />
  <text x="355" y="95" class="title">2. Profile Validation (Now)</text>
  <text x="355" y="115" class="text">Run test_user_complete.py for</text>
  <text x="355" y="132" class="text">09-10-1990 Loznica vs kundli.txt</text>

  <rect x="640" y="70" width="230" height="90" class="box" />
  <text x="655" y="95" class="title">3. API Stability</text>
  <text x="655" y="115" class="text">Lock divisional logic, verify</text>
  <text x="655" y="132" class="text">/charts and /divisional endpoints</text>

  <!-- Arrows row 1 -->
  <line x1="270" y1="115" x2="340" y2="115" class="arrow" />
  <line x1="570" y1="115" x2="640" y2="115" class="arrow" />

  <!-- Row 2: Frontend MVP -->
  <rect x="40" y="200" width="260" height="100" class="box" />
  <text x="55" y="225" class="title">4. Frontend Input & Charts</text>
  <text x="55" y="245" class="text">Form → /charts/calculate</text>
  <text x="55" y="262" class="text">South Indian D1, D9, D10</text>

  <rect x="340" y="200" width="260" height="100" class="box" />
  <text x="355" y="225" class="title">5. Auth & Persistence</text>
  <text x="355" y="245" class="text">Supabase/Postgres users</text>
  <text x="355" y="262" class="text">Save/load charts</text>

  <rect x="640" y="200" width="230" height="100" class="box" />
  <text x="655" y="225" class="title">6. PDF & UX Polish</text>
  <text x="655" y="245" class="text">PDF report, loading states,</text>
  <text x="655" y="262" class="text">mobile responsive UI</text>

  <!-- Arrows row 2 -->
  <line x1="170" y1="160" x2="170" y2="200" class="arrow" />
  <line x1="470" y1="160" x2="470" y2="200" class="arrow" />
  <line x1="755" y1="160" x2="755" y2="200" class="arrow" />

  <line x1="300" y1="250" x2="340" y2="250" class="arrow" />
  <line x1="600" y1="250" x2="640" y2="250" class="arrow" />

  <!-- Row 3: Deployment & Advanced -->
  <rect x="190" y="330" width="260" height="80" class="box" />
  <text x="205" y="355" class="title">7. Deploy Staging</text>
  <text x="205" y="375" class="text">Vercel frontend, Railway/Render</text>
  <text x="205" y="392" class="text">backend + Supabase DB</text>

  <rect x="500" y="330" width="260" height="80" class="box" />
  <text x="515" y="355" class="title">8. Advanced Features</text>
  <text x="515" y="375" class="text">More yogas, KP/Jaimini, transit</text>
  <text x="515" y="392" class="text">views, multi-language, matching</text>

  <!-- Arrows row 3 -->
  <line x1="470" y1="300" x2="320" y2="330" class="arrow" />
  <line x1="450" y1="370" x2="500" y2="370" class="arrow" />

</svg>
